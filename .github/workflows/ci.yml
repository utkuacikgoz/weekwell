name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (domain + mobile)
        run: npm test
      - name: API boot smoke test
        working-directory: apps/api
        run: |
          ALLOW_DEV_CODES=1 PORT=8799 npx tsx src/server.ts &
          for i in $(seq 1 30); do curl -sf localhost:8799/v1/health && break; sleep 1; done
          curl -sf localhost:8799/v1/health
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Web exports for E2E (on-device build and API-connected build)
        working-directory: apps/mobile
        run: npm run export:web
      - name: Install Chromium
        working-directory: apps/mobile
        run: npx playwright install --with-deps chromium
      - name: E2E, visual, and accessibility checks
        working-directory: apps/mobile
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-artifacts/tmp/playwright-report
          retention-days: 14
